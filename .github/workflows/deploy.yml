name: Deploy to Cloudflare Workers

# Robust push-to-deploy: build, test, then `wrangler deploy` the static `dist/`.
# Runs on every push to the production branch, plus a manual button.
on:
  push:
    branches: [source]
  workflow_dispatch:

# Never run two deploys at once; newer push supersedes an in-flight one.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pnpm version comes from package.json "packageManager"
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Build first (parity test reads the built dist/), then gate on the test suite.
      - run: pnpm build
      - run: pnpm test

      - name: Deploy
        run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
